# TEMPORARY diagnostic workflow (branch-only; deleted before merging).
#
# Runs the ConPTY handshake probe with --nocapture so the raw startup byte
# captures land in the job log. Exists to gather evidence on real Windows
# conhost behaviour for the local-terminal startup artifact (orphan first
# glyph / doubled prompt), not to gate anything.
name: Probe ConPTY handshake

on:
  push:
    branches: [codex/ssh/conpty-handshake-answer-swap]
  workflow_dispatch:

permissions:
  contents: read

env:
  # aws-lc-sys falls back to its bundled prebuilt NASM objects when the
  # assembler is missing on the MSVC toolchain (same as the main CI).
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  probe:
    name: ConPTY handshake probe (windows-2022)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Probe
        run: |
          cargo test --locked --manifest-path backend/Cargo.toml `
            conpty_ `
            -- --nocapture --test-threads=1
