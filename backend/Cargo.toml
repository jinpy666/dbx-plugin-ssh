[package]
name = "dbx-plugin-ssh"
version = "0.7.0"
edition = "2021"
license = "MIT"
authors = ["jinpy"]

[workspace]

[dependencies]
aes-gcm = "0.11"
base64 = "0.23"
data-encoding = "2"
dbx-plugin-sdk = "0.1.0"
getrandom = "0.4"
hmac = "0.13"
portable-pty = "0.9.0"
if-addrs = "0.15.0"
# Terminal trigger (expect) stage patterns — see src/triggers.rs.
regex = "1"
russh = { version = "0.62", features = ["des"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
pageant = "0.2"

# The OS keychain tier only ships where a native keychain exists; the Linux
# secret-service backend pulls libdbus (absent in store build containers and
# on headless servers), so Linux always uses the keyfile tier. keyring 4's
# default "v1" feature keeps the Entry API and target-gates each native
# backend (apple keychain / windows native), so no explicit feature list.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = "4"

# The DBX sidecar SDK is vendored under shared/ so a standalone checkout does
# not depend on the source monorepo or a sibling host checkout. See
# docs/REPOSITORY_SPLIT.zh-CN.md for the future public-package migration plan.
[patch.crates-io]
dbx-plugin-sdk = { path = "../shared/sdk/rust/dbx-plugin-sdk" }

[dev-dependencies]
tempfile = "3"
