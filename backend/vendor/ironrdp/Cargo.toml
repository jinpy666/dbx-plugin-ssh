    "ironrdp-mstsgu?/rustls",
]
server = ["dep:ironrdp-server"]
session = ["dep:ironrdp-session"]
svc = ["dep:ironrdp-svc"]

[lib]
name = "ironrdp"
path = "src/lib.rs"
test = false
